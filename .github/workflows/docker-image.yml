name: Build and push Docker image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        run: |
          IMAGE_ID="ghcr.io/${{ github.repository_owner }}/raycloudtools"

          # Change all uppercase to lowercase
          IMAGE_ID="$(echo "${IMAGE_ID}" | tr '[A-Z]' '[a-z]')"

          # Strip git ref prefix from version
          VERSION="$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')"

          # Use Docker `latest` tag convention
          [ "${VERSION}" == "main" ] && VERSION=latest

          docker build \
            --file=docker/Dockerfile \
            --label="org.opencontainers.image.created=$(date --iso-8601=seconds --utc)" \
            --label="org.opencontainers.image.description=Command line tools for processing ray clouds, together with an associated C++ library. Ray clouds are point clouds with sensor location included per point." \
            --label="org.opencontainers.image.revision=${{ github.sha }}" \
            --label="org.opencontainers.image.source=${{ github.repositoryUrl }}" \
            --label="org.opencontainers.image.title=raycloudtools" \
            --tag="${IMAGE_ID}:${VERSION}" \
            .
          docker push "${IMAGE_ID}:${VERSION}"
